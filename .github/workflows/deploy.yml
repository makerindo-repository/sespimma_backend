name: Deploy Backend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: /var/www/sespimma-api-go

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Tidy & verify
        run: |
          go mod tidy
          go mod verify

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-w -s" -o api-go.new ./cmd/main.go

      - name: Clean old migrations on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            rm -rf /var/www/sespimma-api-go/migrations

      - name: Copy binary + migrations to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "api-go.new,migrations/"
          target: ${{ env.APP_DIR }}
          overwrite: true

      - name: Run migrations, swap binary, restart
        uses: appleboy/ssh-action@v1.2.2
        env:
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: DB_PASS
          script: |
            set -e
            APP=/var/www/sespimma-api-go
            mkdir -p "$APP/uploads/profile"
            chmod +x "$APP/api-go.new"
            mv -f "$APP/api-go.new" "$APP/api-go"
            export PGPASSWORD="$DB_PASS"
            PSQL="psql -U dafayape -d db_sespimma -h 127.0.0.1"
            $PSQL -c "CREATE TABLE IF NOT EXISTS _ci_migrations (filename VARCHAR(255) PRIMARY KEY, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
            for file in "$APP"/migrations/*.sql; do
              [ -f "$file" ] || continue
              fname="$(basename "$file")"
              applied="$($PSQL -tAc "SELECT 1 FROM _ci_migrations WHERE filename='$fname';")"
              if [ "$applied" != "1" ]; then
                echo "Applying $fname ..."
                sed '/^-- +goose Down/,$d' "$file" | $PSQL --set ON_ERROR_STOP=on -f -
                $PSQL -c "INSERT INTO _ci_migrations (filename) VALUES ('$fname');"
              else
                echo "Skipping $fname (already applied)"
              fi
            done
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
            pm2 restart backend-golang || pm2 start "$APP/api-go" --name "backend-golang" --cwd "$APP" --env production
            pm2 save
            echo "Deploy complete"
