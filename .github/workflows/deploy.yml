name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sesuaikan versi Go dengan yang ada di laptopmu (misal 1.22 atau 1.25)
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - run: go mod tidy
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o api-go ./cmd/main.go

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }} # <-- Harus sama persis dengan yang di Settings GitHub
          password: ${{ secrets.VPS_PASSWORD }}
          source: "api-go,migrations/" # <-- .env sudah dihapus dari sini
          target: "/var/www/sespimma-api-go" # <-- Target folder yang benar
          overwrite: true

      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/sespimma-api-go
            chmod +x api-go
            
            # Restart pakai PM2, bukan systemctl
            pm2 restart backend-golang
            pm2 save