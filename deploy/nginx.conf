# /etc/nginx/sites-available/sespimma
# Symlink: sudo ln -sf /etc/nginx/sites-available/sespimma /etc/nginx/sites-enabled/

upstream sespimma_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name 103.172.205.183;

    client_max_body_size 10M;

    # ── REST API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://sespimma_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket (real-time location feed) ──────────────────────────────
    location /api/ws/ {
        proxy_pass         http://sespimma_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── Profile photo static files ────────────────────────────────────────
    location /uploads/ {
        proxy_pass         http://sespimma_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires            30d;
        add_header         Cache-Control "public, immutable";
    }
}
